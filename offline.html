<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2744">
  <title>مسار — لا يوجد اتصال</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#1a2744;color:#f5edd8;font-family:Arial,Tahoma,sans-serif}.card{width:min(420px,100%);padding:30px;border-radius:16px;background:#16213e;border:1px solid #2c3e6b;text-align:center}.mark{width:52px;height:52px;margin:0 auto 16px;display:grid;place-items:center;border-radius:13px;background:#c8923a;color:#1a2744;font-size:22px;font-weight:800}h1{font-size:20px;margin:0 0 10px}p{line-height:1.8;color:#c7cfe4;margin:0 0 18px}button{min-height:44px;border:0;border-radius:9px;padding:10px 18px;background:#c8923a;color:#1a2744;font:700 14px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">م</div>
    <h1>يلزم اتصال بالإنترنت</h1>
    <p>حفاظًا على خصوصية بيانات الطلبة، لا يحتفظ مسار بنسخة منها للاستخدام دون اتصال.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
